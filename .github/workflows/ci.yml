# PRの作成・更新のたびに、backend/frontendそれぞれのビルド・検査を自動実行するワークフロー。
# これが無いと「コンパイルが通らないコード」「型エラーがあるコード」でもPRを作成でき、
# レビュアーが気付くまでマージ可能な状態のままになってしまう。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    # backend/src/main/resources/application.properties が要求する3つの環境変数
    # （DB_URL/DB_USERNAME/DB_PASSWORD）を、下のservicesで起動するPostgreSQLに向ける。
    # これはテスト基盤を新たに整備するためではなく、既存のTaskManagementApplicationTests
    # （contextLoads）を「DB未接続で失敗する」状態のままCIに入れないための最小限の措置。
    env:
      DB_URL: jdbc:postgresql://localhost:5432/taskmanagement_ci
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: taskmanagement_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        # コンテナ起動直後はPostgreSQLがまだ接続を受け付けないため、
        # pg_isreadyで「実際に接続できる状態」になるまでジョブの開始を待たせる。
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # Gradle本体のダウンロード・依存関係解決結果をGitHub Actions側でキャッシュし、
      # 実行のたびに毎回フルダウンロードするのを防ぐ公式アクション。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradleのcheckタスクにはcheckstyleMain・spotbugsMain（静的解析）と
      # test（既存のcontextLoadsスモークテスト）がぶら下がっており、
      # buildタスクはこのcheckに加えてbootJarによるビルド可否まで確認する。
      - name: Build and check
        working-directory: backend
        run: ./gradlew build

      # 失敗時、Checkstyle/SpotBugsのレポート（何が・どこで検出されたか）をArtifactとして
      # 残す。GitHub ActionsのログはHTMLレポートより読みにくいため。
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/build/reports/
          retention-days: 7

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 現時点ではerror（correctnessカテゴリ、既定で有効）のみでCIを失敗させる。
      # 品質チェックでsuspicious/jsx-a11y/promiseから検出された8件の指摘（別Issueで管理）は
      # 現状warning扱いのため、--deny-warningsを付けていないこのコマンドでは失敗しない。
      # それらの指摘が解消され次第、--deny-warningsを付けて警告もCIの失敗対象に含める
      # ことを検討する（段階的にゲートを厳しくする方針）。
      - name: Lint
        working-directory: frontend
        run: npx oxlint

      # tsc -b（型チェック）を含むVite本番ビルド。型エラーがあればここで失敗する。
      - name: Build
        working-directory: frontend
        run: npm run build
