plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.spotbugs' version '6.5.10'
}

group = 'com.tkmedia'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// Bean Validation（Jakarta Validation）の実装（Hibernate Validator）を追加する。
	// これが無いと @Valid や @NotBlank / @Size といったアノテーションを付けても一切検証されない
	// （アノテーション自体はjakarta.validation-apiが提供するが、実際にチェックする実装が別途必要）。
	// 書き込みAPI（POST）でリクエストの内容を検証するために今回初めて導入する
	// （docs/spring-boot/09-write-api-validation.md 29章参照）。
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// javac自身が持つ追加警告（未使用のimportやdeprecated APIの利用など）をすべて有効にする。
// Checkstyle/SpotBugsのような外部ツールを導入する前から使えるコンパイラ標準の検査であり、
// 追加の依存やダウンロードが不要（docs/spring-boot/02-build-config.md 参照）。
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:all'
}

// SpotBugs: コンパイル後のbytecodeを解析してバグの可能性がある箇所を検出する静的解析ツール。
// Checkstyleがソースコードの見た目（未使用import等）を見るのに対し、SpotBugsは実際の挙動に
// 近いレベル（bytecode）で「nullになり得る値の非チェック参照」「使われていない戻り値」といった
// 実質的な不具合を検出する。
spotbugs {
	// effort: 解析の深さ。'max'はSpotBugsが用意する中で最も詳細な解析を行う設定
	// （その分、他のeffortよりも解析に時間がかかる）。
	toolVersion = '4.10.3'
	// GroovyのDSLでは `effort = 'max'` のような文字列代入もできるが、Gradle 10で廃止予定の
	// 非推奨機能（文字列→enumの暗黙変換）に依存してしまうため、valueOf(...)でenum定数を明示的に
	// 解決してから.set()で渡す（`Effort.MAX`という書き方だとGroovyがKotlin実装の内部クラスと
	// 誤認してConfigurationエラーになるため、あえてvalueOfを介す）。
	effort.set(com.github.spotbugs.snom.Effort.valueOf('MAX'))
	// reportLevel: 検出結果として報告する最低の重要度。DEFAULT（Medium）は、
	// 明らかなバグ（High）に加えて、バグである可能性が高いもの（Medium）まで報告する。
	reportLevel.set(com.github.spotbugs.snom.Confidence.valueOf('DEFAULT'))
	// excludeFilter: 実装のコーディングスタイル上、意図的に許容しているパターンを除外する
	// 設定ファイル。理由はconfig/spotbugs/exclude.xmlのコメントを参照。
	excludeFilter = file('config/spotbugs/exclude.xml')
}
// レポートをHTML・text形式でも出力する（既定のXML形式は機械可読だが人が読みにくいため）。
// text形式を追加しているのは、push前チェック（scripts/quality-check.sh）が失敗時に
// このファイルをコンテナ内から直接catして指摘内容をそのまま表示するため。
// HTMLはブラウザでの閲覧向けで、この用途には向かない。
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html {
			required = true
		}
		text {
			required = true
		}
	}
}

// Checkstyle: ソースコードを字句解析して、書式ではなく「見落とし・誤りの可能性」を検出するツール。
// 検査項目自体はconfig/checkstyle/checkstyle.xml（このファイル冒頭のコメント参照）で定義する。
checkstyle {
	toolVersion = '13.9.0'
	// テストコードも検査対象に含める。導入当初は空のスモークテスト1件しか無く価値が薄いとして
	// 除外していたが、Service層・Controller層のテストが増えたため方針を戻した。テストコードも
	// 「読んで意味が分かること」が重要な資産であり、本体と同じ規約で保つ。
	sourceSets = [sourceSets.main, sourceSets.test]
}
